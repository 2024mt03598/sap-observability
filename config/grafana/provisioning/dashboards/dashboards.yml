apiVersion: 1
providers:
  - name: repo-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: false          # the Git copy is the truth; UI edits are not kept
    updateIntervalSeconds: 30      # new/changed JSON files appear without a Grafana restart
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
