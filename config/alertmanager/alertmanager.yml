global:
  # --- SMTP relay used for email alerts (edit these 3 values for your provider) ---
  smtp_smarthost: "smtp.gmail.com:587"        # Office 365: smtp.office365.com:587 | SendGrid: smtp.sendgrid.net:587
  smtp_from: "2024mt03598@wilp.bits-pilani.ac.in"
  smtp_auth_username: "2024mt03598@wilp.bits-pilani.ac.in"    # SendGrid: the literal word apikey
  # The password is NOT in Git. It is read from a file you create once on r3server-tf.
  # The file lives OUTSIDE /etc/alertmanager because each deploy replaces that whole folder.
  smtp_auth_password_file: /etc/alertmanager-secrets/smtp_password
  smtp_require_tls: true

route:
  receiver: email
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: "abhinav_tyagi@outlook.com"
        send_resolved: true
