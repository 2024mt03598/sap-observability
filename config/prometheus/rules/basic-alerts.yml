groups:
  - name: basic
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.job }} on {{ $labels.instance }} is down"
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU above 85% on {{ $labels.instance }}"
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% on {{ $labels.instance }}"
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk free on {{ $labels.instance }} ({{ $labels.mountpoint }})"
  - name: pushed-from-alloy
    rules:
      - alert: HostNotReporting
        expr: absent(up {job="alloy", instance="r3server"})
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No metrics from r3server for 3+ minutes (host down or Alloy stopped)"
      - alert: OracleDatabaseDown
        expr: oracledb_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Oracle DB is down on {{ $labels.instance }}"
      - alert: OracleMetricsMissing
        expr: absent(oracledb_up)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "No oracledb_up metric received for 10 minutes (exporter, Alloy or remote_write may be down)"
  - name: sap_netweaver_alerts
    rules:
      #  Dispatcher Queue Depth Threshold / High
      - alert: SAPDispatcherQueueDepthHigh
        expr: sap_dispatcher_queue_now > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SAP Dispatcher queue depth high on {{ $labels.instance_name }}"
          description: "The dispatcher queue depth for type {{ $labels.type }} on instance {{ $labels.instance_name }} is current at {{ $value }} (exceeds threshold of 80)."

      #  Dispatcher Queue High (Absolute threshold reached)
      - alert: SAPDispatcherQueueDepthHighWatermark
        expr: sap_dispatcher_queue_high >= 40
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SAP Dispatcher queue high watermark reached on {{ $labels.instance_name }}"
          description: "The peak dispatcher queue depth for type {{ $labels.type }} on instance {{ $labels.instance_name }} reached {{ $value }}."

      # Oracle Session Utilization Exceeded
      - alert: OracleSessionsUtilizationHigh
        expr: (oracledb_resource_current_utilization{job="oracle_db_exporter", resource_name="sessions"} / oracledb_resource_limit_value{resource_name="sessions"}) * 100 > 80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Oracle DB session utilization high"
          description: "Oracle database active session utilization has reached {{ $value | printf \"%.2f\" }}% of max limit (threshold is 80%)."

      #Low Free Space on /oracle/SRE/oraarch
      - alert: OracleArchiveSpaceLow
        expr: (node_filesystem_free_bytes{mountpoint="/oracle/SRE/oraarch"} / node_filesystem_size_bytes{mountpoint="/oracle/SRE/oraarch"}) * 100 < 20
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Oracle Archive Log space critically low"
          description: "Free space on /oracle/SRE/oraarch is at {{ $value | printf \"%.2f\" }}% on instance {{ $labels.instance }}."

      #Low Free Space on Root Filesystem
      - alert: RootFilesystemSpaceLow
        expr: (node_filesystem_free_bytes{mountpoint="/"}/ node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem space low"
          description: "Free space on root mountpoint (/) is at {{ $value | printf \"%.2f\" }}% on instance {{ $labels.instance }}." 
