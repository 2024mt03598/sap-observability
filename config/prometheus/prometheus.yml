global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

# Hosts running Grafana Alloy PUSH their metrics (remote_write), so they are not listed here.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["localhost:9093"]
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
